# Disposable synthetic-data stack. Import this file from the feature branch.
# Never add production resource names, credentials, or database URLs here.
previews:
  generation: "off"

projects:
  - name: power-research-staging
    environments:
      - name: staging
        databases:
          - name: power-research-staging-db
            databaseName: power_research_staging
            user: power_research_staging
            postgresMajorVersion: "16"
            region: singapore
            plan: free
            ipAllowList: []
        services:
          - type: web
            name: power-research-staging-api
            runtime: docker
            repo: https://github.com/tranthanhduysph-coder/power-ai
            branch: feature/research-analytics-consent-admin
            region: singapore
            plan: free
            autoDeployTrigger: "off"
            dockerfilePath: apps/api/Dockerfile
            dockerContext: .
            dockerCommand: python -m app.db.research_staging
            healthCheckPath: /api/v1/health
            envVars:
              - key: RESEARCH_STAGING_ENABLED
                value: "true"
              - key: DATABASE_URL
                fromDatabase:
                  name: power-research-staging-db
                  property: connectionString
              - key: CORS_ORIGINS
                fromService:
                  type: web
                  name: power-research-staging-web
                  envVarKey: RENDER_EXTERNAL_URL
              - key: AUTH_MODE
                value: firebase
              - key: FIREBASE_PROJECT_ID
                sync: false
              - key: GOOGLE_APPLICATION_CREDENTIALS
                value: /etc/secrets/research-staging-firebase.json
              - key: RESEARCH_ADMIN_FIREBASE_UID
                sync: false
              - key: RESEARCH_ADMIN_EMAIL
                value: ttduy@sgu.edu.vn
              - key: RESEARCH_PSEUDONYM_KEY
                generateValue: true
              - key: AI_PROVIDER
                value: mock
              - key: VISION_PROVIDER
                value: disabled
              - key: EMBEDDING_PROVIDER
                value: local_hash
          - type: web
            name: power-research-staging-web
            runtime: node
            repo: https://github.com/tranthanhduysph-coder/power-ai
            branch: feature/research-analytics-consent-admin
            rootDir: apps/web
            region: singapore
            plan: free
            autoDeployTrigger: "off"
            buildCommand: npm ci && node scripts/build-research-staging.mjs
            startCommand: npm run start -- -H 0.0.0.0 -p $PORT
            envVars:
              - key: NODE_VERSION
                value: "22"
              - key: RESEARCH_STAGING_API_ORIGIN
                fromService:
                  type: web
                  name: power-research-staging-api
                  envVarKey: RENDER_EXTERNAL_URL
              - key: NEXT_PUBLIC_AUTH_MODE
                value: firebase
              - key: NEXT_PUBLIC_USE_FIREBASE_EMULATOR
                value: "false"
              - key: NEXT_PUBLIC_FIREBASE_PROJECT_ID
                fromService:
                  type: web
                  name: power-research-staging-api
                  envVarKey: FIREBASE_PROJECT_ID
              - key: NEXT_PUBLIC_FIREBASE_API_KEY
                sync: false
              - key: NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN
                sync: false
              - key: NEXT_PUBLIC_FIREBASE_APP_ID
                sync: false
