name: Research Analytics Checks

on:
  pull_request:
    paths:
      - 'apps/api/**'
      - 'apps/web/**'
      - 'database/migrations/015_research_analytics.sql'
      - '.github/workflows/research-analytics-ci.yml'
  workflow_dispatch:

jobs:
  api:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/api
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements.txt
      - run: python -m compileall -q app
      - run: python -m pytest -q tests --ignore=tests/test_research_integration.py
  web-types:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - run: npm ci
      - run: npx tsc --noEmit

  postgres-migration:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
          POSTGRES_DB: research_integration_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U test -d research_integration_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r apps/api/requirements.txt
      - name: Create disposable smoke database
        run: >-
          python -c "import psycopg;
          c=psycopg.connect('postgresql://test:test@127.0.0.1:5432/research_integration_test', autocommit=True);
          c.execute('CREATE DATABASE research_migration_test'); c.close()"
      - name: Test migration on disposable PostgreSQL
        env:
          RESEARCH_TEST_DATABASE_URL: postgresql://test:test@127.0.0.1:5432/research_migration_test
        run: python apps/api/tests/smoke_research_migration.py
      - name: Apply full schema and verify migration is skipped on rerun
        env:
          PYTHONPATH: apps/api
          DATABASE_URL: postgresql+psycopg://test:test@127.0.0.1:5432/research_integration_test
        run: |
          python -m app.db.migrate
          python -m app.db.migrate
      - name: Test consent, withdrawal, exports and concurrent imports
        env:
          PYTHONPATH: apps/api
          RESEARCH_TEST_DATABASE_URL: postgresql+psycopg://test:test@127.0.0.1:5432/research_integration_test
        run: python -m pytest -q apps/api/tests/test_research_integration.py
